{% extends "base.html" %}{% block title %}Add resource | Smart Library{% endblock %}
{% block content %}<div class="mb-4"><a href="{{ url_for('catalog') }}" class="small text-success text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to catalogue</a><h2 class="fw-bold mt-2 mb-1">Add a resource</h2><div class="muted">Create a catalogue record for a book or learning resource.</div></div>
<div class="surface p-4" style="max-width:900px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-8"><label class="form-label fw-semibold">Title *</label><input class="form-control" name="title" required maxlength="240"></div><div class="col-md-4"><label class="form-label fw-semibold">Author *</label><input class="form-control" name="author" required maxlength="180"></div>
<div class="col-md-4"><label class="form-label fw-semibold">ISBN</label><input class="form-control" name="isbn" maxlength="32"></div><div class="col-md-4"><label class="form-label fw-semibold">Publisher</label><input class="form-control" name="publisher"></div><div class="col-md-4"><label class="form-label fw-semibold">Category / Subject</label><input class="form-control" name="category" value="General"></div>
<div class="col-md-4"><label class="form-label fw-semibold">Publication year</label><input class="form-control" type="number" name="publication_year" min="1000" max="2100"></div><div class="col-md-4"><label class="form-label fw-semibold">Shelf / Location</label><input class="form-control" name="shelf_location" placeholder="e.g. A-02-14"></div><div class="col-md-4"><label class="form-label fw-semibold">Number of copies</label><input class="form-control" type="number" name="copies" value="1" min="1" max="10000" required></div>
<div class="col-md-4"><label class="form-label fw-semibold">Resource type</label><select class="form-select" name="resource_type"><option value="physical">Physical</option><option value="digital">Digital record</option><option value="reference">Reference</option></select></div><div class="col-12"><label class="form-label fw-semibold">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a href="{{ url_for('catalog') }}" class="btn btn-light">Cancel</a><button class="btn btn-brand px-4">Save resource</button></div></form></div>{% endblock %}
